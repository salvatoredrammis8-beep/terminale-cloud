<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>Terminale Fullscreen</title><style>*{box-sizing:border-box;margin:0;padding:0;}html,body{width:100%%;height:100%%;overflow:hidden;background:#050811;color:#00ff66;font-family:Consolas,monospace;}body{display:flex;flex-direction:column;padding:10px;}.header{display:flex;justify-content:space-between;background:#0f172a;border:1px solid #1e293b;padding:8px 12px;border-radius:6px;margin-bottom:10px;}.title{color:#38bdf8;font-weight:bold;}.status{color:#4ade80;}.input-container{display:flex;gap:10px;margin-bottom:10px;}input{flex:1;padding:12px;background:#090d16;border:1px solid #1e293b;color:#38bdf8;font-size:16px;border-radius:6px;outline:none;}button{padding:12px 20px;background:#0284c7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}#output{flex:1;width:100%%;height:100%%;background:#020617;border:1px solid #1e293b;border-radius:6px;padding:15px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;user-select:text;-webkit-user-select:text;color:#00ff66;font-size:15px;line-height:1.4;}</style></head><body><div class="header"><span class="title">TERMINALE WEB LOCALE</span><span class="status">ONLINE</span></div><form class="input-container" onsubmit="sendCommand(event)"><input type="text" id="command" placeholder="Digita o incolla un comando..." autofocus autocomplete="off"><button type="submit">Esegui</button></form><pre id="output">Terminale pronto a tutto schermo. Puoi selezionare e copiare qualsiasi testo con il mouse.</pre><script>async function sendCommand(e){if(e)e.preventDefault();const input=document.getElementById("command");const output=document.getElementById("output");const cmd=input.value.trim();if(!cmd)return;input.value="";output.innerText+="\n\n> "+cmd+"\n[Esecuzione in corso...]";try{const res=await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:cmd})});const data=await res.text();output.innerText+="\n"+data;}catch(err){output.innerText+="\n[Errore: impossibile comunicare con il server locale]";}output.scrollTop=output.scrollHeight;}</script></body></html>
